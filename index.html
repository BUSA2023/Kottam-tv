<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ലദൽ മദീന 2K26 - Live TV Display</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;700;800&family=Outfit:wght@400;800;900&display=swap" rel="stylesheet">

    <style>
        /* ========================================================
           ULTRA-LITE TV OPTIMIZED CSS (STATIC BACKGROUND, HIGH VISIBILITY)
           ======================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Anek Malayalam', sans-serif; 
            background: #020617; /* Solid dark color is much better for TV RAM */
            color: #ffffff; 
            overflow: hidden; 
            height: 100vh; width: 100vw;
        }
        .num-font { font-family: 'Outfit', sans-serif; }

        /* OVERLAYS */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; z-index: 9999;
            display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer;
        }
        .start-btn { background: #fbbf24; color: #000; padding: 3vh 4vw; font-size: 4vh; font-weight: bold; border-radius: 2vh; border: none; cursor: pointer; text-transform: uppercase; transition: 0.3s;}
        
        /* MAIN VIEW CONTAINER - Simplified Fade */
        .view-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; flex-direction: column;
            padding: 3vh 4vw; 
            animation: simpleFade 0.8s ease-in-out; 
            overflow: hidden;
        }
        .view-active { display: flex; }
        @keyframes simpleFade { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER & TITLE */
        .header { text-align: center; margin-bottom: 2vh; height: 10vh; display: flex; align-items: center; justify-content: center; }
        .fest-logo-img { height: 9vh; max-height: 80px; object-fit: contain; }
        
        .page-title { 
            text-align: center; font-size: 3vh; color: #fbbf24; margin-bottom: 2vh; 
            font-weight: bold; background: rgba(255,255,255,0.05); padding: 1vh; 
            border-radius: 2vh; text-transform: uppercase; letter-spacing: 0.2vw;
            flex-shrink: 0;
        }

        /* --- PAGE 1: TOTAL SCORE --- */
        .dashboard-content { display: flex; justify-content: space-around; align-items: center; flex: 1; padding: 0 4vw; min-height: 0; }
        .team-block { text-align: center; width: 42%; background: rgba(255,255,255,0.05); padding: 3vh; border-radius: 4vh; border: 0.2vh solid rgba(255,255,255,0.1); }
        .team-name { font-size: 5vh; font-weight: bold; margin-bottom: 1vh; }
        .team-name.team-a { color: #fbbf24; }
        .team-name.team-b { color: #a855f7; }
        .huge-points { font-size: 20vh; font-weight: 900; line-height: 1; }
        
        .gender-split { display: flex; justify-content: space-around; margin-top: 2vh; background: rgba(0,0,0,0.4); padding: 1.5vh; border-radius: 2vh; }
        .g-stat { display: flex; flex-direction: column; }
        .g-label { font-size: 1.8vh; color: #94a3b8; font-weight: bold; }
        .g-pts { font-size: 4vh; font-weight: bold; }
        .g-pts.boys { color: #60a5fa; } .g-pts.girls { color: #f472b6; }

        .vs-circle { background: #0f172a; border: 0.4vh solid #1e293b; border-radius: 50%; width: 10vh; height: 10vh; display: flex; align-items: center; justify-content: center; font-size: 3vh; font-weight: 900; color: #64748b; font-style: italic; }

        .stats-row { display: flex; justify-content: center; gap: 3vw; margin-top: 2vh; flex-shrink: 0; height: 12vh; }
        .stat-box { background: rgba(255,255,255,0.05); border: 0.2vh solid rgba(255,255,255,0.1); border-radius: 2vh; padding: 1.5vh 3vw; text-align: center; flex: 1; max-width: 20vw; display: flex; flex-direction: column; justify-content: center;}
        .stat-value { font-size: 4.5vh; font-weight: 900; color: #34d399; line-height: 1.1; }
        .stat-label { font-size: 1.6vh; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1vw; margin-top: 0.5vh;}

        /* --- PAGE 2: LATEST RESULTS --- */
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh; flex: 1; min-height: 0; overflow: hidden; padding: 0.5vh; }
        .res-card { background: rgba(255,255,255,0.05); border: 0.2vh solid rgba(255,255,255,0.1); border-radius: 2vh; padding: 2vh; display: flex; flex-direction: column; justify-content: center; }
        .res-card.newest { grid-column: span 2; border-color: #10b981; background: rgba(16,185,129,0.1); padding: 2.5vh; position: relative; }
        
        .corner-ribbon { width: 12vh; height: 12vh; overflow: hidden; position: absolute; top: 0; right: 0; z-index: 10; border-radius: 0 2vh 0 0; }
        .corner-ribbon::before { content: 'LATEST'; position: absolute; display: block; width: 18vh; padding: 0.8vh 0; background: #f59e0b; color: #000; font-weight: 900; font-size: 1.4vh; text-align: center; right: -4vh; top: 2.5vh; transform: rotate(45deg); }

        .rc-title { font-weight: bold; color: #fff; border-bottom: 0.1vh solid rgba(255,255,255,0.1); padding-bottom: 1vh; margin-bottom: 1vh; display: flex; justify-content: space-between; align-items: center;}
        .rc-title-text { display: flex; flex-direction: column; }
        .rc-title-text span { font-size: 2.5vh; }
        .rc-cat { font-size: 1.4vh; background: #1e293b; padding: 0.5vh 1vw; border-radius: 1vh; color: #94a3b8; font-weight: bold; text-transform: uppercase;}
        
        .rc-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 1vh 1.5vw; border-radius: 1vh; margin-bottom: 0.8vh; }
        .rc-name { font-size: 2.2vh; font-weight: bold; color: #f1f5f9; }
        .rc-team { font-size: 1.4vh; font-weight: bold; padding: 0.5vh 1vw; border-radius: 0.8vh; background: rgba(255,255,255,0.1); }
        .rc-team.a { color: #fbbf24; } .rc-team.b { color: #a855f7; }

        /* --- CATEGORY SCORES --- */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; flex: 1; align-items: center; min-height: 0;}
        .cat-box { background: rgba(255,255,255,0.05); border: 0.1vh solid rgba(255,255,255,0.1); border-radius: 2vh; padding: 3vh 2vw; text-align: center; }
        .cat-title { font-size: 3vh; font-weight: bold; color: #fbbf24; margin-bottom: 3vh; text-transform: uppercase; border-bottom: 0.2vh solid rgba(255,255,255,0.1); padding-bottom: 1vh;}
        .cat-team-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5vh; background: rgba(0,0,0,0.5); padding: 1.5vh 2vw; border-radius: 1.5vh; }
        .cat-tname { font-size: 2.5vh; font-weight: bold; }
        .cat-tname.a { color: #fbbf24; } .cat-tname.b { color: #a855f7; }
        .cat-pts { font-size: 4vh; font-weight: 900; color: #fff; }

        /* --- POINT TABLES --- */
        .table-container { background: rgba(255,255,255,0.05); border-radius: 2vh; padding: 1vh; border: 0.1vh solid rgba(255,255,255,0.1); flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .pt-header-table { width: 100%; border-collapse: collapse; background: #000; border-radius: 1vh 1vh 0 0; flex-shrink: 0; table-layout: fixed; }
        .no-scroll-wrapper { flex: 1; background: rgba(0,0,0,0.3); border-radius: 0 0 1vh 1vh; overflow: hidden; display: flex; flex-direction: column; }
        .pt-table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
        .pt-table tbody tr { height: 1%; } 
        th, td { text-align: center; border-bottom: 0.1vh solid rgba(255,255,255,0.05); }
        .pt-header-table th { color: #94a3b8; text-transform: uppercase; font-size: 1.8vh; border-bottom: 0.2vh solid #334155; padding: 1vh;}
        .pt-table td { padding: 0.2vh 1vw; font-size: 2.2vh; font-weight: bold; }
        .t-left { text-align: left !important; padding-left: 2vw !important; vertical-align: middle;}
        
        .prog-name-wrapper { display: flex; align-items: center; justify-content: flex-start; width: 100%; }
        .p-name-txt { font-size: 2.2vh; font-weight: bold; display: flex; flex-direction: column; line-height: 1.1; color: #f1f5f9; }
        
        .s-tag { font-size: 1.2vh; background: #334155; padding: 0.4vh 0.6vw; border-radius: 0.5vh; color: #cbd5e1; margin-left: 1vw; font-weight: bold; text-transform: uppercase; flex-shrink: 0;}
        .s-grp { background: #78350f; color: #fcd34d; }
        .s-cat { background: #064e3b; color: #34d399; }
        
        .pt-team-a { color: #fbbf24; font-size: 2.2vh !important; } 
        .pt-team-b { color: #a855f7; font-size: 2.2vh !important; }
        .br-left { border-left: 0.2vh solid #334155; }

        /* TOAST */
        #toast { position: fixed; top: 4vh; right: 4vw; background: #10b981; color: white; padding: 2vh 3vw; border-radius: 2vh; font-size: 3vh; font-weight: bold; display: none; z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);}
    </style>
</head>
<body>

    <!-- AUDIO FILES (Corrected to your requested exact filenames) -->
    <audio id="sound-score" src="mixkit-sci-fi-reject-notification-896.wav" preload="auto"></audio>
    <audio id="sound-result" src="mixkit-sci-fi-reject-notification-896.wav" preload="auto"></audio>

    <!-- START SCREEN -->
    <div id="start-overlay" onclick="startApp()">
        <button class="start-btn">Start Live TV Display</button>
        <p style="margin-top:2vh; font-size:2vh; color:#94a3b8; font-weight:bold;">Optimized for Android TV</p>
    </div>

    <div id="toast">പുതിയ അപ്ഡേറ്റ്!</div>

    <div id="app" style="display:none; width: 100%; height: 100%; position: relative;">
        
        <!-- VIEW 1: TOTAL SCORE DASHBOARD -->
        <div id="view-1" class="view-container view-active">
            <div class="header">
                <img src="1000741398.jpg" class="fest-logo-img" alt="Ladal Madeena" onerror="this.style.display='none'">
            </div>
            <div class="page-title">ടീം പോയിന്റുകൾ (TOTAL SCORE)</div>
            <div class="dashboard-content">
                <!-- Team A -->
                <div class="team-block">
                    <div class="team-name team-a">KHAIBAR WARRIORS</div>
                    <div class="huge-points num-font" id="score-teamA">0</div>
                    <div class="gender-split">
                        <div class="g-stat"><span class="g-label">BOYS</span><span class="g-pts boys num-font" id="score-teamA-boys">0</span></div>
                        <div class="g-stat"><span class="g-label">GIRLS</span><span class="g-pts girls num-font" id="score-teamA-girls">0</span></div>
                    </div>
                </div>
                <div class="vs-circle">VS</div>
                <!-- Team B -->
                <div class="team-block">
                    <div class="team-name team-b">KHANDAQ FIGHTERS</div>
                    <div class="huge-points num-font" id="score-teamB">0</div>
                    <div class="gender-split">
                        <div class="g-stat"><span class="g-label">BOYS</span><span class="g-pts boys num-font" id="score-teamB-boys">0</span></div>
                        <div class="g-stat"><span class="g-label">GIRLS</span><span class="g-pts girls num-font" id="score-teamB-girls">0</span></div>
                    </div>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-box"><div class="stat-value num-font" id="stat-programs">0</div><div class="stat-label">മത്സരങ്ങൾ</div></div>
                <div class="stat-box"><div class="stat-value num-font" id="stat-candidates">0</div><div class="stat-label">കുട്ടികൾ</div></div>
                <div class="stat-box"><div class="stat-value num-font" id="stat-results">0</div><div class="stat-label">റിസൾട്ടുകൾ</div></div>
            </div>
        </div>

        <!-- VIEW 2: LATEST RESULTS -->
        <div id="view-2" class="view-container">
            <div class="header">
                <img src="1000741398.jpg" class="fest-logo-img" alt="Ladal Madeena" onerror="this.style.display='none'">
            </div>
            <div class="page-title">ഏറ്റവും പുതിയ ഫലങ്ങൾ (LATEST RESULTS)</div>
            <div class="results-grid" id="results-grid-container">
                <!-- Injected by JS -->
            </div>
        </div>

        <!-- VIEW 3: BOYS CATEGORY SCORES -->
        <div id="view-3" class="view-container">
            <div class="header">
                <img src="1000741398.jpg" class="fest-logo-img" alt="Ladal Madeena" onerror="this.style.display='none'">
            </div>
            <div class="page-title">BOYS CATEGORY SCORES (ആൺകുട്ടികൾ)</div>
            <div class="category-grid" id="boys-categories-grid">
                <!-- Injected by JS -->
            </div>
        </div>

        <!-- VIEW 4: GIRLS CATEGORY SCORES -->
        <div id="view-4" class="view-container">
            <div class="header">
                <img src="1000741398.jpg" class="fest-logo-img" alt="Ladal Madeena" onerror="this.style.display='none'">
            </div>
            <div class="page-title">GIRLS CATEGORY SCORES (പെൺകുട്ടികൾ)</div>
            <div class="category-grid" id="girls-categories-grid">
                <!-- Injected by JS -->
            </div>
        </div>

        <!-- DYNAMIC VIEWS CONTAINER FOR PROGRAM TABLES -->
        <div id="dynamic-tables"></div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // FIREBASE CONFIG (Syncing to Admin Database)
        const firebaseConfig = {
            apiKey: "AIzaSyCo3S007XNUl1bAfgAlMR1vJyDQBNFf6MI",
            authDomain: "kottam-eee89.firebaseapp.com",
            projectId: "kottam-eee89",
            storageBucket: "kottam-eee89.firebasestorage.app",
            messagingSenderId: "558082092753",
            appId: "1:558082092753:web:c0a69f647998061a3adff0"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        // GLOBAL CONSTANTS & STATE
        const TEAM_A = "KHAIBAR WARRIORS";
        const TEAM_B = "KHANDAQ FIGHTERS";
        const CATEGORIES = ['Kiddies', 'Sub Junior', 'Junior', 'Senior', 'Super Senior', 'General'];

        let state = { programs: [], candidates: [], results: [] };
        let prevScoreA = -1; let prevScoreB = -1; let prevTotalRes = -1;

        // HELPER FUNCTIONS
        const getProg = (id) => state.programs.find(p => p.id === id);
        const getCand = (id) => state.candidates.find(c => c.id === id);
        const getTeamBadgeClass = (team) => team === TEAM_A ? 'a' : 'b';

        // --- GLOBAL EXPORTS FOR HTML UI ---
        window.appStarted = false;
        window.wakeLockObj = null;
        window.startApp = () => {
            toggleFullScreen();
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            
            unlockAudio(document.getElementById('sound-score'));
            unlockAudio(document.getElementById('sound-result'));

            window.appStarted = true; 
            simulateInteraction();
            startCarousel();
            renderAll();
        };

        function unlockAudio(audioElem) {
            if(!audioElem) return;
            audioElem.muted = true;
            let p = audioElem.play();
            if (p !== undefined) p.then(() => { audioElem.pause(); audioElem.currentTime = 0; audioElem.muted = false; }).catch(e=>{});
        }

        function toggleFullScreen() {
            try {
                let el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen().catch(e=>{}); 
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } catch (e) {}
        }

        function playSound(type) {
            if (!window.appStarted) return;
            try { 
                let audio = document.getElementById(type === 'score' ? 'sound-score' : 'sound-result'); 
                if (audio) { audio.pause(); audio.currentTime = 0; audio.volume = 1; audio.muted = false; audio.play().catch(e=>{}); }
            } catch(e) {}
        }

        function showToast(msg) {
            let t = document.getElementById('toast'); 
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 5000);
        }

        async function preventSleep() {
            if(!window.appStarted) return;
            try {
                if ('wakeLock' in navigator) { 
                    if(window.wakeLockObj) await window.wakeLockObj.release().catch(e=>{}); 
                    window.wakeLockObj = await navigator.wakeLock.request('screen');
                }
            } catch(e) {}
        }

        function simulateInteraction() {
            if (!window.appStarted) return;
            try { document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift', bubbles: true })); } catch(e){}
            preventSleep();
        }
        setInterval(simulateInteraction, 20000);

        // --- CAROUSEL LOGIC ---
        let currentViewIndex = 1;
        let maxViews = 4; // Dynamically updated when tables are generated
        let carouselTimer;

        function startCarousel() {
            if (carouselTimer) clearInterval(carouselTimer);
            carouselTimer = setInterval(function() {
                // Hide all views
                let containers = document.querySelectorAll('.view-container');
                containers.forEach(function(c) { c.classList.remove('view-active'); });
                
                currentViewIndex++;
                if(currentViewIndex > maxViews) currentViewIndex = 1;
                
                let nextView = document.getElementById('view-' + currentViewIndex);
                if(nextView) nextView.classList.add('view-active');
                else {
                    currentViewIndex = 1;
                    document.getElementById('view-1').classList.add('view-active');
                }
            }, 15000); // 15 seconds per page
        }

        // --- FIREBASE INIT ---
        signInAnonymously(auth).then(() => {
            onSnapshot(doc(db, 'settings', 'config'), (snap) => {
                if (snap.exists()) { state.programs = snap.data().programs || []; renderAll(); }
            });
            onSnapshot(collection(db, 'candidates'), (snap) => {
                let arr = []; snap.forEach(doc => { arr.push({ id: doc.id, ...doc.data() }); });
                state.candidates = arr; renderAll();
            });
            onSnapshot(collection(db, 'results'), (snap) => {
                let arr = []; snap.forEach(doc => { arr.push({ id: doc.id, ...doc.data() }); });
                state.results = arr; renderAll();
            });
        }).catch(err => {
            console.error("Auth Error", err);
        });

        // --- RENDER LOGIC ---
        function renderAll() {
            if (!window.appStarted) return;
            
            // Stats Object
            let stats = {
                A: { total: 0, boysTotal: 0, girlsTotal: 0, boys: {}, girls: {} },
                B: { total: 0, boysTotal: 0, girlsTotal: 0, boys: {}, girls: {} }
            };
            
            CATEGORIES.forEach(c => {
                stats.A.boys[c] = 0; stats.A.girls[c] = 0;
                stats.B.boys[c] = 0; stats.B.girls[c] = 0;
            });

            state.results.forEach(res => {
                let prog = getProg(res.progId);
                let isGroup = prog ? (prog.name.toLowerCase().includes('group') || prog.name.toLowerCase().includes('burd') || prog.name.toLowerCase().includes('mala') || prog.name.toLowerCase().includes('qawwali') || prog.name.toLowerCase().includes('mash up') || prog.name.toLowerCase().includes('moulid') || prog.name.toLowerCase().includes('newspaper') || prog.name.toLowerCase().includes('collage')) : false;
                
                // Read from DB if available, fallback to defaults
                let pts1 = res.pts1 || (isGroup ? 10 : 5);
                let pts2 = res.pts2 || (isGroup ? 5 : 3);
                let pts3 = res.pts3 || (isGroup ? 3 : 1);

                const addPts = (ids, pts) => {
                    let arr = Array.isArray(ids) ? ids : (ids ? [ids] : []);
                    arr.forEach(id => {
                        let c = getCand(id);
                        if (c) {
                            let tk = c.team === TEAM_A ? 'A' : (c.team === TEAM_B ? 'B' : null);
                            if(tk) {
                                stats[tk].total += pts;
                                if(c.gender === 'BOYS') {
                                    stats[tk].boysTotal += pts;
                                    if(stats[tk].boys[c.cat] !== undefined) stats[tk].boys[c.cat] += pts;
                                } else if(c.gender === 'GIRLS') {
                                    stats[tk].girlsTotal += pts;
                                    if(stats[tk].girls[c.cat] !== undefined) stats[tk].girls[c.cat] += pts;
                                }
                            }
                        }
                    });
                };

                addPts(res.first, pts1);
                addPts(res.second, pts2);
                addPts(res.third, pts3);
            });
            
            let sortedRes = state.results.slice().sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            // Audio Triggers & Auto-Jump to Latest Results
            if (prevScoreA !== -1 && (prevScoreA !== stats.A.total || prevScoreB !== stats.B.total)) { 
                playSound('score'); 
                showToast("പോയിന്റ് നില അപ്ഡേറ്റ് ചെയ്തു!"); 
            }
            if (prevTotalRes !== -1 && sortedRes.length > prevTotalRes) { 
                playSound('result'); 
                showToast("🔥 പുതിയ റിസൾട്ട് പ്രസിദ്ധീകരിച്ചു! 🔥"); 
                
                // Instantly jump to Latest Results View (View 2)
                let containers = document.querySelectorAll('.view-container');
                containers.forEach(c => c.classList.remove('view-active'));
                currentViewIndex = 2;
                let view2 = document.getElementById('view-2');
                if (view2) view2.classList.add('view-active');
                
                // Restart the carousel timer
                startCarousel();
            }
            prevScoreA = stats.A.total; prevScoreB = stats.B.total; prevTotalRes = sortedRes.length;

            // Update Dashboard (View 1)
            document.getElementById('score-teamA').innerText = stats.A.total;
            document.getElementById('score-teamA-boys').innerText = stats.A.boysTotal;
            document.getElementById('score-teamA-girls').innerText = stats.A.girlsTotal;
            
            document.getElementById('score-teamB').innerText = stats.B.total;
            document.getElementById('score-teamB-boys').innerText = stats.B.boysTotal;
            document.getElementById('score-teamB-girls').innerText = stats.B.girlsTotal;

            document.getElementById('stat-programs').innerText = state.programs.length;
            document.getElementById('stat-candidates').innerText = state.candidates.length;
            document.getElementById('stat-results').innerText = state.results.length;

            // Generate Category Grids (View 3 & View 4)
            let generateCatGrid = (genderKey) => {
                return CATEGORIES.map(cat => `
                    <div class="cat-box">
                        <div class="cat-title">${cat}</div>
                        <div class="cat-team-row">
                            <span class="cat-tname a">KHAIBAR</span>
                            <span class="cat-pts num-font">${stats.A[genderKey][cat]}</span>
                        </div>
                        <div class="cat-team-row">
                            <span class="cat-tname b">KHANDAQ</span>
                            <span class="cat-pts num-font">${stats.B[genderKey][cat]}</span>
                        </div>
                    </div>
                `).join('');
            };

            document.getElementById('boys-categories-grid').innerHTML = generateCatGrid('boys');
            document.getElementById('girls-categories-grid').innerHTML = generateCatGrid('girls');

            // Update Latest Results (View 2)
            const getNamesStr = (ids) => {
                let arr = Array.isArray(ids) ? ids : (ids ? [ids] : []);
                if(arr.length === 0) return '-';
                return arr.map(i => { let c = getCand(i); return c ? c.name : '-'; }).join(', ');
            };
            const getTeamStr = (ids) => {
                let arr = Array.isArray(ids) ? ids : (ids ? [ids] : []);
                if(arr.length === 0) return '';
                let teamStr = "";
                // Assuming all winners in a specific rank usually belong to same team in solo events
                let c = getCand(arr[0]);
                if (c) {
                    if (c.team === TEAM_A) teamStr = `<span class='rc-team a'>KHAIBAR</span>`;
                    else if (c.team === TEAM_B) teamStr = `<span class='rc-team b'>KHANDAQ</span>`;
                }
                return teamStr;
            };

            let resHtml = sortedRes.length === 0 ? "<h2 style='color:#64748b; grid-column:span 2; text-align:center;'>ഫലങ്ങൾ വന്നിട്ടില്ല...</h2>" : "";
            for(let r=0; r < Math.min(sortedRes.length, 6); r++) {
                let lRes = sortedRes[r]; let lProg = getProg(lRes.progId);
                let isNew = r === 0 ? " newest" : "";
                let rib = isNew ? "<div class='corner-ribbon'></div>" : "";
                let pName = lProg ? (lProg.progNo ? `<span style="color:#fbbf24; margin-right:5px;">#${lProg.progNo}</span>${lProg.name}` : lProg.name) : '-';

                resHtml += `<div class='res-card${isNew}'>${rib}
                    <div class='rc-title'>
                        <div class='rc-title-text'><span>${pName}</span></div>
                        <span class='rc-cat'>${lProg ? lProg.cat : ''}</span>
                    </div>`;
                if(getNamesStr(lRes.first) !== '-') resHtml += `<div class='rc-row'><span class='rc-name'>🥇 ${getNamesStr(lRes.first)}</span>${getTeamStr(lRes.first)}</div>`;
                if(getNamesStr(lRes.second) !== '-') resHtml += `<div class='rc-row'><span class='rc-name'>🥈 ${getNamesStr(lRes.second)}</span>${getTeamStr(lRes.second)}</div>`;
                if(getNamesStr(lRes.third) !== '-') resHtml += `<div class='rc-row'><span class='rc-name'>🥉 ${getNamesStr(lRes.third)}</span>${getTeamStr(lRes.third)}</div>`;
                resHtml += "</div>";
            }
            document.getElementById('results-grid-container').innerHTML = resHtml;

            // Generate Dynamic Program Tables
            let sortedProgs = [...state.programs].sort((a,b) => Number(a.progNo || 0) - Number(b.progNo || 0));
            let chunkedProgs = [];
            for (let i = 0; i < sortedProgs.length; i += 8) {
                chunkedProgs.push(sortedProgs.slice(i, i + 8));
            }

            let dynamicTablesHtml = "";
            let viewCounter = 5; // Starts after view 4

            chunkedProgs.forEach((chunk, index) => {
                let tbody = chunk.map(p => {
                    let pName = p.progNo ? `<span style="color:#fbbf24; margin-right:5px;">#${p.progNo}</span>${p.name}` : p.name;
                    let tTag = ""; 
                    let isGroup = p.name.toLowerCase().includes('group') || p.name.toLowerCase().includes('burd') || p.name.toLowerCase().includes('mala');
                    if(isGroup) tTag += "<span class='s-tag s-grp'>Group</span>";
                    tTag += `<span class='s-tag s-cat'>${p.cat}</span>`;

                    let pRes = state.results.find(r => r.progId === p.id);
                    let a1="-", a2="-", a3="-", b1="-", b2="-", b3="-";

                    if (pRes) {
                        let pts1 = pRes.pts1 || (isGroup ? 10 : 5);
                        let pts2 = pRes.pts2 || (isGroup ? 5 : 3);
                        let pts3 = pRes.pts3 || (isGroup ? 3 : 1);

                        const checkPts = (ids, pts) => {
                            let arr = Array.isArray(ids) ? ids : (ids ? [ids] : []);
                            arr.forEach(id => {
                                let cand = getCand(id);
                                if(cand) {
                                    if(cand.team === TEAM_A) {
                                        if(pts === pts1) a1 = pts; else if(pts === pts2) a2 = pts; else if(pts === pts3) a3 = pts;
                                    } else if(cand.team === TEAM_B) {
                                        if(pts === pts1) b1 = pts; else if(pts === pts2) b2 = pts; else if(pts === pts3) b3 = pts;
                                    }
                                }
                            });
                        };
                        checkPts(pRes.first, pts1); checkPts(pRes.second, pts2); checkPts(pRes.third, pts3);
                    }

                    let sA1 = a1 !== "-" ? "color:#fbbf24; font-size:120%;" : "color:#334155;";
                    let sA2 = a2 !== "-" ? "color:#cbd5e1; font-size:110%;" : "color:#334155;";
                    let sA3 = a3 !== "-" ? "color:#d97706; font-size:110%;" : "color:#334155;";
                    let sB1 = b1 !== "-" ? "color:#fbbf24; font-size:120%;" : "color:#334155;";
                    let sB2 = b2 !== "-" ? "color:#cbd5e1; font-size:110%;" : "color:#334155;";
                    let sB3 = b3 !== "-" ? "color:#d97706; font-size:110%;" : "color:#334155;";

                    return `<tr>
                        <td class='t-left'><div class='prog-name-wrapper'><div class='p-name-txt'>${pName}</div>${tTag}</div></td>
                        <td style='${sA1}'>${a1}</td><td style='${sA2}'>${a2}</td><td style='${sA3}'>${a3}</td>
                        <td class='br-left' style='${sB1}'>${b1}</td><td style='${sB2}'>${b2}</td><td style='${sB3}'>${b3}</td>
                    </tr>`;
                }).join('');

                dynamicTablesHtml += `
                    <div id="view-${viewCounter}" class="view-container">
                        <div class="header">
                            <img src="1000741398.jpg" class="fest-logo-img" onerror="this.style.display='none'">
                        </div>
                        <div class="page-title">പോയിന്റ് ടേബിൾ (TABLE ${index + 1}/${chunkedProgs.length})</div>
                        <div class="table-container">
                            <table class="pt-header-table"><colgroup><col style="width:28%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup>
                                <thead><tr><th rowspan="2" class="t-left">മത്സരം (Program)</th><th colspan="3" class="pt-team-a">KHAIBAR</th><th colspan="3" class="pt-team-b br-left">KHANDAQ</th></tr><tr><th>🥇 1st</th><th>🥈 2nd</th><th>🥉 3rd</th><th class="br-left">🥇 1st</th><th>🥈 2nd</th><th>🥉 3rd</th></tr></thead>
                            </table>
                            <div class="no-scroll-wrapper">
                                <table class="pt-table"><colgroup><col style="width:28%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup>
                                    <tbody>${tbody}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
                viewCounter++;
            });

            document.getElementById('dynamic-tables').innerHTML = dynamicTablesHtml;
            maxViews = viewCounter - 1; // Update global max views for the carousel
        }
    </script>
</body>
</html>

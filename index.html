<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ലദൽ മദീന 2K26 - TV Display</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;700;800;900&family=Outfit:wght@400;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Anek Malayalam', sans-serif; 
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            color: #ffffff; overflow: hidden; height: 100vh; width: 100vw;
        }
        .num-font { font-family: 'Outfit', sans-serif; }
        
        .zero-gravity-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .orb {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: floatOrb infinite linear; opacity: 0;
        }
        @keyframes floatOrb {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer;
        }
        .start-btn { background: #ec4899; color: white; padding: 20px 40px; font-size: 24px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(236,72,153,0.5); transition: 0.3s;}
        .start-btn:hover { transform: scale(1.05); }

        #flash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9998; opacity: 0; pointer-events: none; }

        #new-result-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #2e1065 0%, #020617 100%);
            z-index: 9500; display: none; opacity: 0; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
            transition: opacity 0.5s ease-in-out; overflow: hidden;
            perspective: 1000px;
        }
        
        .nr-light-rays {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: repeating-conic-gradient(from 0deg, transparent 0deg 15deg, rgba(139, 92, 246, 0.15) 15deg 30deg);
            animation: spinRays 40s linear infinite; z-index: 0; pointer-events: none;
        }
        @keyframes spinRays { 100% { transform: rotate(360deg); } }
        
        .nr-glass-panel {
            background: rgba(10, 10, 30, 0.6);
            backdrop-filter: blur(25px); border: 2px solid rgba(139, 92, 246, 0.5);
            border-radius: 40px; padding: 50px; width: 95%; max-width: 1500px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9), inset 0 0 40px rgba(139, 92, 246, 0.3);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transform: translateY(100px) rotateX(10deg); opacity: 0; z-index: 1;
            animation: cinematicReveal 1s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cinematicReveal { to { transform: translateY(0) rotateX(0deg); opacity: 1; } }

        .nr-top-badge { background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #451a03; font-weight: 900; padding: 10px 30px; border-radius: 30px; letter-spacing: 4px; font-size: 24px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(251,191,36,0.8); animation: pulseGlow 2s infinite;}
        .nr-prog-title { font-size: clamp(45px, 6.5vw, 85px); font-weight: 900; background: linear-gradient(to bottom, #ffffff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); margin-bottom: 5px; text-transform: uppercase;}
        .nr-prog-cat { font-size: clamp(22px, 3.5vw, 30px); color: #fbbf24; font-weight: 900; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 2px; text-shadow: 0 5px 10px rgba(0,0,0,0.8);}

        .nr-winners-grid { display: flex; flex-direction: column; gap: 25px; width: 100%; align-items: center; margin-top: 15px;}
        .nr-sub-winners { display: flex; gap: 30px; width: 100%; justify-content: center; }
        
        .nr-winner-card {
            background: rgba(0,0,0,0.7); border-radius: 25px; padding: 30px; flex: 1;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border-top: 6px solid; position: relative; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            opacity: 0; transform: translateY(60px) scale(0.9);
        }
        
        .nr-winner-card.gold { 
            border-color: #fbbf24; 
            background: linear-gradient(180deg, rgba(251,191,36,0.2) 0%, rgba(0,0,0,0.9) 100%); 
            width: 100%; max-width: 950px; border-width: 10px; z-index: 3;
            box-shadow: 0 30px 60px rgba(251,191,36,0.4);
            animation: popInGold 0.8s 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .nr-winner-card.silver { 
            border-color: #e2e8f0; 
            background: linear-gradient(180deg, rgba(226,232,240,0.15) 0%, rgba(0,0,0,0.9) 100%); 
            max-width: 480px;
            animation: popInSub 0.8s 1.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .nr-winner-card.bronze { 
            border-color: #d97706; 
            background: linear-gradient(180deg, rgba(217,119,6,0.15) 0%, rgba(0,0,0,0.9) 100%); 
            max-width: 480px;
            animation: popInSub 0.8s 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popInGold { to { opacity: 1; transform: translateY(0) scale(1.08); } }
        @keyframes popInSub { to { opacity: 1; transform: translateY(0) scale(1); } }

        .nr-winner-card.gold::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg); animation: shine 4s infinite 2.5s;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        .nr-medal { font-size: 40px; font-weight: 900; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 10px; text-shadow: 0 5px 10px rgba(0,0,0,0.8); background: rgba(0,0,0,0.5); padding: 8px 30px; border-radius: 50px;}
        .nr-winner-card.gold .nr-medal { font-size: 55px; color: #fbbf24; background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.4); }
        .nr-winner-card.silver .nr-medal { color: #f8fafc; background: rgba(226,232,240,0.15); border: 1px solid rgba(226,232,240,0.4);}
        .nr-winner-card.bronze .nr-medal { color: #f59e0b; background: rgba(217,119,6,0.15); border: 1px solid rgba(217,119,6,0.4);}

        .nr-names { font-size: clamp(22px, 2.5vw, 34px); font-weight: 800; color: #f8fafc; line-height: 1.4; max-height: 140px; overflow-y: auto; width: 100%; margin: 10px 0;}
        .nr-winner-card.gold .nr-names { font-size: clamp(30px, 3.5vw, 48px); color: #ffffff; max-height: 180px; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .nr-names::-webkit-scrollbar { width: 6px; }
        .nr-names::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }

        .nr-team { font-size: 22px; font-weight: 900; margin-top: 15px; padding: 10px 30px; border-radius: 12px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);}
        .nr-team.kw { background: linear-gradient(135deg, #be123c, #9f1239); color: #fda4af; border: 1px solid #fda4af;}
        .nr-team.kf { background: linear-gradient(135deg, #4338ca, #312e81); color: #a5b4fc; border: 1px solid #a5b4fc;}

        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 30px rgba(251,191,36,0.8); } 50% { box-shadow: 0 0 60px rgba(251,191,36,1); } }

        .nav-zone { position: fixed; top: 0; bottom: 0; width: 10vw; z-index: 9000; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .nav-zone:hover { opacity: 1; }
        .nav-zone.left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.4), transparent); }
        .nav-zone.right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.4), transparent); }
        .nav-btn { background: rgba(255,255,255,0.2); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; backdrop-filter: blur(5px); }

        .view-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; padding: 15px 30px; flex-direction: column;
            animation: fadeIn 0.8s ease-in-out; overflow: hidden;
        }
        .view-active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .header { text-align: center; margin-bottom: 10px; }
        .fest-logo-img { height: clamp(70px, 15vh, 150px); object-fit: contain; filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.8)); border-radius: 10px; }
        .page-title { text-align: center; font-size: clamp(14px, 2vw, 18px); color: #fbbf24; margin-bottom: 10px; font-weight: bold; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 10px; text-transform: uppercase; letter-spacing: 1px;}

        /* SCORE VIEW */
        .dashboard-content { display: flex; justify-content: space-around; align-items: center; flex: 1; padding: 0 50px; }
        .team-block { text-align: center; width: 40%; background: rgba(15, 23, 42, 0.6); padding: 30px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .team-name { font-size: clamp(24px, 4vw, 45px); font-weight: bold; margin-bottom: 5px; }
        .team-name.team-a { color: #fb7185; text-shadow: 0 0 20px rgba(251, 113, 133, 0.4); }
        .team-name.team-b { color: #818cf8; text-shadow: 0 0 20px rgba(129, 140, 248, 0.4); }
        .huge-points { font-size: clamp(60px, 13vw, 200px); font-weight: 900; line-height: 1; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .gender-split { display: flex; justify-content: space-around; margin-top: 15px; background: rgba(0,0,0,0.4); border-radius: 15px; padding: 10px; }
        .g-stat { display: flex; flex-direction: column; align-items: center; }
        .g-lbl { font-size: 14px; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .g-pts { font-size: 28px; font-weight: 900; color: #e2e8f0; }

        .vs-circle { background: #0f172a; border: 5px solid #1e293b; border-radius: 50%; width: clamp(50px, 8vw, 80px); height: clamp(50px, 8vw, 80px); display: flex; align-items: center; justify-content: center; font-size: clamp(16px, 3vw, 24px); font-weight: 900; color: #64748b; font-style: italic; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .stats-row { display: flex; justify-content: center; gap: clamp(10px, 2vw, 30px); margin-top: 20px; padding-bottom: 10px; }
        .stat-box { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: clamp(10px, 2vw, 15px) clamp(15px, 3vw, 30px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); min-width: clamp(120px, 15vw, 180px); }
        .stat-value { font-size: clamp(24px, 4vw, 35px); font-weight: 900; color: #34d399; line-height: 1.2; text-shadow: 0 0 10px rgba(52,211,153,0.3);}
        .stat-label { font-size: clamp(10px, 1.5vw, 14px); color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;}

        /* LATEST RESULTS VIEW */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; flex: 1; align-content: start; overflow-y: auto; padding-right:10px; }
        .results-grid::-webkit-scrollbar { display: none; }
        .res-card { background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; position: relative; }
        .res-card.newest { grid-column: 1 / -1; border-color: #10b981; box-shadow: 0 0 25px rgba(16,185,129,0.3); background: linear-gradient(135deg, rgba(16,185,129,0.15) 0%, rgba(15,23,42,0.95) 100%); padding: 20px; display: flex; flex-direction: column; justify-content: center; }
        .res-card.newest .rc-title { font-size: clamp(20px, 3vw, 28px); border-bottom: 2px solid rgba(16,185,129,0.3); padding-bottom: 10px; margin-bottom: 12px; padding-right: 120px; }
        .res-card.newest .rc-cat { font-size: 16px; padding: 4px 10px; background: #064e3b; color: #34d399; }
        .res-card.newest .rc-row { padding: 10px 18px; margin-bottom: 8px; }
        .res-card.newest .rc-name { font-size: clamp(18px, 2.5vw, 24px); }
        .res-card.newest .rc-team { font-size: 15px; padding: 5px 10px; }
        .corner-ribbon { width: 140px; height: 140px; overflow: hidden; position: absolute; top: 0; right: 0; z-index: 10; border-radius: 0 15px 0 0; pointer-events: none; }
        .corner-ribbon::before { content: '✨ LATEST'; position: absolute; display: block; width: 220px; padding: 10px 0; background: linear-gradient(90deg, #fbbf24, #f59e0b); box-shadow: 0 5px 15px rgba(0,0,0,0.5); color: #78350f; font-weight: 900; font-size: 13px; text-align: center; right: -55px; top: 32px; transform: rotate(45deg); letter-spacing: 3px; }
        
        .rc-title { font-size: clamp(16px, 2vw, 20px); font-weight: bold; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .rc-cat { font-size: 11px; background: #1e293b; padding: 4px 8px; border-radius: 6px; color: #94a3b8; font-weight: bold; text-transform: uppercase;}
        .rc-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; }
        .rc-row.first { border-left: 5px solid #fbbf24; }
        .rc-row.second { border-left: 5px solid #cbd5e1; }
        .rc-row.third { border-left: 5px solid #b45309; }
        .rc-name { font-size: clamp(14px, 2vw, 18px); font-weight: bold; color: #f1f5f9; }
        .rc-team { font-size: 12px; font-weight: bold; padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); }
        .rc-team.a { color: #fb7185; } .rc-team.b { color: #818cf8; }

        .ts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; flex: 1; align-content: center; }
        .ts-card { background: rgba(15,23,42,0.8); border: 2px solid rgba(251,191,36,0.3); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4);}
        .ts-header { background: linear-gradient(90deg, #78350f, #92400e); padding: 10px; text-align: center; font-size: 18px; font-weight: 900; color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; }
        .ts-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ts-icon { font-size: 35px; width: 50px; text-align: center; text-shadow: 0 5px 10px rgba(0,0,0,0.5);}
        .ts-info { flex: 1; display: flex; flex-direction: column; padding-left: 10px; }
        .ts-award { font-size: 10px; font-weight: bold; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .ts-name { font-size: 18px; font-weight: bold; color: #fff; margin-top: 2px; line-height: 1.1;}
        .ts-team { font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-top: 5px; width: fit-content; background: rgba(255,255,255,0.1); }
        .ts-team.a { color: #fb7185; } .ts-team.b { color: #818cf8; }
        .ts-pts { font-size: 35px; font-weight: 900; color: #34d399; padding-left: 10px; text-align: right; }

        .table-container { background: rgba(15, 23, 42, 0.8); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;}
        .pt-header-table { width: 100%; border-collapse: collapse; background: rgba(2, 6, 23, 0.98); border-radius: 10px 10px 0 0; flex-shrink: 0; table-layout: fixed; border-bottom: 2px solid #334155;}
        .no-scroll-wrapper { flex: 1; background: rgba(0,0,0,0.4); border-radius: 0 0 10px 10px; overflow: hidden; display: flex; flex-direction: column; }
        .pt-table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
        
        .pt-table tbody { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .pt-table tbody tr { display: flex; width: 100%; flex: 1; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .pt-table td { display: flex; align-items: center; justify-content: center; height: 100%; overflow: hidden;}
        
        .pt-header-table th { color: #94a3b8; text-transform: uppercase; font-size: 14px; padding: 8px; text-align: center;}
        .pt-header-table .t-left { text-align: left; padding-left: 20px;}
        .pt-table .t-left { justify-content: flex-start; padding-left: 20px !important;}
        
        .prog-name-wrapper { display: flex; align-items: center; justify-content: flex-start; width: 100%; }
        .p-name-txt { font-weight: bold; display: flex; flex-direction: column; line-height: 1.1; color: #f1f5f9; }
        .s-tag { font-size: 10px; background: #334155; padding: 3px 5px; border-radius: 4px; color: #cbd5e1; margin-left: 8px; font-weight: bold; text-transform: uppercase; flex-shrink: 0;}
        .s-grp { background: #78350f; color: #fcd34d; }
        .s-nst { background: #0f766e; color: #a7f3d0; }
        
        .pt-team-a { color: #fb7185; } .pt-team-b { color: #818cf8; }
        .br-left { border-left: 2px solid #334155; }
        .col-28 { width: 28%; } .col-12 { width: 12%; }

        /* SCALING MATRIX */
        .pt-table td { font-size: 20px; font-weight: bold; padding: 5px 10px; }
        .p-name-txt { font-size: 20px; }
        .pt-team-a, .pt-team-b { font-size: 22px !important; }

        .semi-compact-table td { font-size: 17px; padding: 4px 8px; }
        .semi-compact-table .p-name-txt { font-size: 17px; }
        .semi-compact-table .pt-team-a, .semi-compact-table .pt-team-b { font-size: 18px !important; }
        .semi-compact-table .s-tag { font-size: 9px; padding: 2px 4px;}

        .compact-table td { font-size: 14px; padding: 3px 5px; }
        .compact-table .p-name-txt { font-size: 14px; }
        .compact-table .pt-team-a, .compact-table .pt-team-b { font-size: 15px !important; }
        .compact-table .s-tag { font-size: 8px; padding: 2px 3px;}

        .micro-table td { font-size: 12px; padding: 2px 4px; }
        .micro-table .p-name-txt { font-size: 12px; }
        .micro-table .pt-team-a, .micro-table .pt-team-b { font-size: 13px !important; }
        .micro-table .s-tag { display: none; }
        
        .nano-table td { font-size: 10px; padding: 1px 3px; font-weight: normal;}
        .nano-table .p-name-txt { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 25vw; display: block;}
        .nano-table .pt-team-a, .nano-table .pt-team-b { font-size: 11px !important; font-weight: bold; }
        .nano-table .s-tag { display: none; }

        #toast { position: fixed; top: 20px; right: 20px; background: #10b981; color: white; padding: 15px 30px; border-radius: 10px; font-size: 20px; font-weight: bold; transform: translateY(-150px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <!-- NOTIFICATION AUDIO -->
    <audio id="sound-score" src="mixkit-sci-fi-reject-notification-896.wav" preload="auto"></audio>
    <audio id="sound-result" src="mixkit-sci-fi-reject-notification-896.wav" preload="auto"></audio>

    <div class="zero-gravity-bg" id="zg-bg"></div>
    <div id="flash-screen"></div>
    
    <!-- NEW RESULT CINEMATIC OVERLAY -->
    <div id="new-result-overlay"></div>

    <div id="start-overlay" onclick="startApp()">
        <button class="start-btn">Start Live Result TV</button>
        <p style="margin-top:20px; font-size:16px; color:#94a3b8; text-align:center;">Click anywhere to launch<br><br><span style="color:#fbbf24">Supports Keyboard Navigation (Left/Right Arrows) & Swipe</span></p>
    </div>

    <!-- UI Navigation Zones -->
    <div class="nav-zone left" onclick="prevView()"><div class="nav-btn">&#10094;</div></div>
    <div class="nav-zone right" onclick="nextView()"><div class="nav-btn">&#10095;</div></div>

    <div id="toast">പുതിയ അപ്ഡേറ്റ്!</div>

    <div id="app" style="display:none; width: 100%; height: 100%; position: relative;">
        <!-- DYNAMIC VIEWS WILL BE INJECTED HERE -->
    </div>

    <script>
        var appStarted = false;
        var slideTimer = null;
        var currentViewIndex = 1;

        auth.signInAnonymously().then(function() {
            db.collection('settings').doc('config').onSnapshot(function(snap) {
                if (snap.exists) { var d = snap.data(); if (d.programs) state.programs = d.programs; if(appStarted) renderAll(); }

        function getCandNamesString(ids) {

            return teams.length > 0 ? teams.join(' & ') : '-';

        function getProgramPoints(progNo) {

            const pts10 = ['54', '155', '257', '458', '04', '4', '105', '205', '206', '303', '304', '403'];
            
            if (pts15.includes(pNo)) return { p1: 15, p2: 10, p3: 5 };
            if (pts10.includes(pNo)) return { p1: 10, p2: 7, p3: 5 };
            return { p1: 5, p2: 3, p3: 1 };
        }

                });
            });

            totalViews = viewCounter - 1;
            document.getElementById('app').innerHTML = dynamicHtml;
            showCurrentView(); 
        }
    </script>
</body>

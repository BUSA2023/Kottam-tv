<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>മെഹ്ഫിലെ നൂർ 2026 - TV Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;700;800&family=Outfit:wght@400;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Anek Malayalam', sans-serif; background: #020617; color: #ffffff; overflow: hidden; height: 100vh; width: 100vw; }
        .num-font { font-family: 'Outfit', sans-serif; }

        #start-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; }
        .start-btn { background: #ec4899; color: white; padding: 3vh 4vw; font-size: 4vh; font-weight: bold; border-radius: 2vh; border: none; cursor: pointer; text-transform: uppercase; transition: 0.3s;}
        #flash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 9998; opacity: 0; pointer-events: none; }

        /* Manual Nav Controls */
        .nav-zone { position: fixed; top: 0; bottom: 0; width: 15vw; z-index: 9000; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .nav-zone:hover { opacity: 1; }
        .nav-zone.left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.5), transparent); }
        .nav-zone.right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.5), transparent); }
        .nav-btn { background: rgba(255,255,255,0.2); color: white; width: 6vh; height: 6vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3vh; backdrop-filter: blur(5px); }

        .view-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; padding: 4vh 4vw; animation: simpleFade 0.5s ease-in-out; overflow: hidden; }
        .view-active { display: flex; }
        @keyframes simpleFade { from { opacity: 0; } to { opacity: 1; } }

        .header { text-align: center; margin-bottom: 2vh; height: 8vh; display: flex; align-items: center; justify-content: center; }
        .fest-logo-img { height: 8vh; max-height: 80px; object-fit: contain; }
        .page-title { text-align: center; font-size: 3vh; color: #fbbf24; margin-bottom: 2vh; font-weight: bold; background: rgba(255,255,255,0.05); padding: 1vh; border-radius: 2vh; text-transform: uppercase; letter-spacing: 0.2vw; flex-shrink: 0; }

        /* MAIN DASHBOARD */
        .dashboard-content { display: flex; justify-content: space-around; align-items: center; flex: 1; padding: 0 4vw; min-height: 0; }
        .team-block { text-align: center; width: 40%; background: rgba(255,255,255,0.05); padding: 4vh; border-radius: 4vh; border: 0.2vh solid rgba(255,255,255,0.1); }
        .team-name { font-size: 6vh; font-weight: bold; margin-bottom: 1vh; }
        .team-name.team-a { color: #fb7185; } .team-name.team-b { color: #818cf8; }
        .huge-points { font-size: 18vh; font-weight: 900; line-height: 1; }
        .gender-split { display: flex; justify-content: space-around; margin-top: 2vh; background: rgba(0,0,0,0.3); border-radius: 2vh; padding: 1.5vh; }
        .g-stat { display: flex; flex-direction: column; align-items: center; }
        .g-lbl { font-size: 1.8vh; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1vw; }
        .g-pts { font-size: 3.5vh; font-weight: 900; color: #e2e8f0; }

        .vs-circle { background: #0f172a; border: 0.4vh solid #1e293b; border-radius: 50%; width: 12vh; height: 12vh; display: flex; align-items: center; justify-content: center; font-size: 4vh; font-weight: 900; color: #64748b; font-style: italic; }
        .stats-row { display: flex; justify-content: center; gap: 3vw; margin-top: 3vh; flex-shrink: 0; height: 12vh; }
        .stat-box { background: rgba(255,255,255,0.05); border: 0.2vh solid rgba(255,255,255,0.1); border-radius: 2vh; padding: 1.5vh 3vw; text-align: center; flex: 1; max-width: 20vw; display: flex; flex-direction: column; justify-content: center; }
        .stat-value { font-size: 4.5vh; font-weight: 900; color: #34d399; line-height: 1.1; }
        .stat-label { font-size: 1.6vh; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1vw;}

        /* LATEST RESULTS */
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5vh; flex: 1; min-height: 0; overflow: hidden; padding: 0.5vh; }
        .res-card { background: rgba(255,255,255,0.05); border: 0.2vh solid rgba(255,255,255,0.1); border-radius: 2vh; padding: 2vh; display: flex; flex-direction: column; justify-content: center; position: relative;}
        .res-card.newest { grid-column: span 2; border-color: #10b981; background: rgba(16,185,129,0.1); padding: 3vh; }
        .corner-ribbon { width: 15vh; height: 15vh; overflow: hidden; position: absolute; top: 0; right: 0; z-index: 10; border-radius: 0 2vh 0 0; }
        .corner-ribbon::before { content: 'LATEST'; position: absolute; display: block; width: 22vh; padding: 1vh 0; background: #f59e0b; color: #000; font-weight: 900; font-size: 1.5vh; text-align: center; right: -5vh; top: 3vh; transform: rotate(45deg); }
        .rc-title { font-weight: bold; color: #fff; border-bottom: 0.1vh solid rgba(255,255,255,0.1); padding-bottom: 1vh; margin-bottom: 1.5vh; display: flex; justify-content: space-between; align-items: center;}
        .rc-title-text { display: flex; flex-direction: column; }
        .rc-title-text span { font-size: 2.8vh; }
        .rc-cat { font-size: 1.5vh; background: #1e293b; padding: 0.5vh 1vw; border-radius: 1vh; color: #94a3b8; font-weight: bold; text-transform: uppercase;}
        .rc-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 1vh 1.5vw; border-radius: 1vh; margin-bottom: 1vh; }
        .rc-name { font-size: 2.5vh; font-weight: bold; color: #f1f5f9; }
        .rc-team { font-size: 1.5vh; font-weight: bold; padding: 0.5vh 1vw; border-radius: 0.8vh; background: rgba(255,255,255,0.1); }

        .table-container { background: rgba(255,255,255,0.05); border-radius: 2vh; padding: 1vh; border: 0.1vh solid rgba(255,255,255,0.1); flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .pt-header-table { width: 100%; border-collapse: collapse; background: #000; border-radius: 1vh 1vh 0 0; flex-shrink: 0; table-layout: fixed; }
        .no-scroll-wrapper { flex: 1; background: rgba(0,0,0,0.3); border-radius: 0 0 1vh 1vh; overflow: hidden; display: flex; flex-direction: column; }
        .pt-table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
        .pt-table tbody tr { height: 1%; } 
        th, td { text-align: center; border-bottom: 0.1vh solid rgba(255,255,255,0.05); }
        .pt-header-table th { color: #94a3b8; text-transform: uppercase; font-size: 1.8vh; border-bottom: 0.2vh solid #334155; padding: 1vh;}
        .pt-table td { padding: 0.5vh 1vw; font-size: 2.2vh; font-weight: bold; }
        .t-left { text-align: left !important; padding-left: 2vw !important; vertical-align: middle;}
        
        .prog-name-wrapper { display: flex; align-items: center; justify-content: flex-start; width: 100%; }
        .p-name-txt { font-size: 2.5vh; font-weight: bold; display: flex; flex-direction: column; line-height: 1.1; color: #f1f5f9; }
        .s-tag { font-size: 1.2vh; background: #334155; padding: 0.4vh 0.6vw; border-radius: 0.5vh; color: #cbd5e1; margin-left: 1vw; font-weight: bold; text-transform: uppercase; flex-shrink: 0;}
        .pt-team-a { color: #fb7185; font-size: 2.5vh !important; } .pt-team-b { color: #818cf8; font-size: 2.5vh !important; }
        .br-left { border-left: 0.2vh solid #334155; }

        .compact-table td { padding: 0.2vh 1vw; font-size: 1.8vh; }
        .compact-table .p-name-txt { font-size: 1.8vh; }
        .semi-compact-table td { padding: 0.4vh 1vw; font-size: 2vh; }
        .semi-compact-table .p-name-txt { font-size: 2vh; }

        /* KALAPRATHIBA VIEW */
        .ts-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2vw; flex: 1; align-content: center; }
        .ts-card { background: rgba(255,255,255,0.05); border: 0.2vh solid rgba(251,191,36,0.3); border-radius: 2vh; overflow: hidden; }
        .ts-header { background: linear-gradient(90deg, #78350f, #92400e); padding: 1.5vh; text-align: center; font-size: 2.5vh; font-weight: 900; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.2vw; }
        .ts-row { display: flex; align-items: center; padding: 2vh; border-bottom: 0.1vh solid rgba(255,255,255,0.05); }
        .ts-icon { font-size: 4vh; width: 6vw; text-align: center; }
        .ts-info { flex: 1; display: flex; flex-direction: column; padding-left: 1vw; }
        .ts-award { font-size: 1.2vh; font-weight: bold; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1vw; }
        .ts-name { font-size: 2.2vh; font-weight: bold; color: #fff; margin-top: 0.5vh; }
        .ts-team { font-size: 1.2vh; font-weight: bold; padding: 0.3vh 0.8vw; border-radius: 0.5vh; display: inline-block; margin-top: 1vh; width: fit-content; background: rgba(255,255,255,0.1); }
        .ts-team.a { color: #fb7185; } .ts-team.b { color: #818cf8; }
        .ts-pts { font-size: 4vh; font-weight: 900; color: #34d399; padding-left: 1vw; text-align: right; }

        #toast { position: fixed; top: 4vh; right: 4vw; background: #10b981; color: white; padding: 2vh 3vw; border-radius: 2vh; font-size: 3vh; font-weight: bold; transform: translateY(-20vh); transition: transform 0.5s; z-index: 10000; }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <audio id="sound-score" src="mixkit-sci-fi-reject-notification-896.wav" preload="auto"></audio>
    <audio id="sound-result" src="mixkit-sci-fi-reject-notification-896.wav" preload="auto"></audio>

    <div id="flash-screen"></div>

    <div id="start-overlay" onclick="startApp()">
        <button class="start-btn">Start Live TV Display</button>
        <p style="margin-top:2vh; font-size:2vh; color:#fbbf24; font-weight:bold;">Supports Keyboard/Swipe Navigation</p>
    </div>

    <!-- UI Navigation Zones -->
    <div class="nav-zone left" onclick="prevView()"><div class="nav-btn">&#10094;</div></div>
    <div class="nav-zone right" onclick="nextView()"><div class="nav-btn">&#10095;</div></div>

    <div id="toast">പുതിയ അപ്ഡേറ്റ്!</div>

    <div id="app" style="display:none; width: 100%; height: 100%; position: relative;">
        <!-- DYNAMIC VIEWS INJECTED HERE -->
    </div>

    <script>
        var appStarted = false;
        var slideTimer = null;
        var currentViewIndex = 1;
        var totalViews = 1;

        function preventSleep() {
            try { if ('wakeLock' in navigator && typeof navigator.wakeLock.request === 'function') { navigator.wakeLock.request('screen').catch(function(){}); } } catch(e) {}
        }
        function toggleFullScreen() {
            try { var el = document.documentElement; if (!document.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } } catch (e) {}
        }
        function unlockAudio(a) { if(a) { a.muted = true; var p = a.play(); if (p !== undefined) p.then(()=>{a.pause(); a.currentTime=0; a.muted=false;}).catch(e=>{}); } }
        
        function showToast(msg) {
            var t = document.getElementById('toast'); t.innerText = msg; t.className = 'show';
            setTimeout(function(){ t.className = ''; }, 5000);
        }
        function playSound(type) {
            if (!appStarted) return;
            try { var a = document.getElementById(type === 'score' ? 'sound-score' : 'sound-result'); if (a) { a.pause(); a.currentTime=0; a.volume=1; a.muted=false; a.play().catch(e=>{}); } } catch(e) {}
        }

        // --- Navigation Logic ---
        function showCurrentView() {
            var views = document.querySelectorAll('.view-container');
            if(views.length === 0) return;
            totalViews = views.length;
            if(currentViewIndex > totalViews) currentViewIndex = 1;
            if(currentViewIndex < 1) currentViewIndex = totalViews;
            
            views.forEach(function(v) { v.className = 'view-container'; });
            var activeView = document.getElementById('view-' + currentViewIndex);
            if(activeView) activeView.className = 'view-container view-active';
        }

        function resetRotation() {
            if(slideTimer) clearInterval(slideTimer);
            slideTimer = setInterval(function() {
                currentViewIndex++;
                showCurrentView();
            }, 15000);
        }

        function nextView() { currentViewIndex++; showCurrentView(); resetRotation(); }
        function prevView() { currentViewIndex--; showCurrentView(); resetRotation(); }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!appStarted) return;
            if (e.key === 'ArrowRight') nextView();
            else if (e.key === 'ArrowLeft') prevView();
        });

        // Touch/Swipe navigation
        var touchStartX = 0;
        document.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', function(e) {
            var touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) nextView(); // swipe left
            if (touchEndX - touchStartX > 50) prevView(); // swipe right
        });

        function triggerEpicReveal() {
            playSound('result');
            var flash = document.getElementById('flash-screen');
            flash.style.transition = 'none'; flash.style.opacity = '1';
            setTimeout(function() { flash.style.transition = 'opacity 0.8s ease-out'; flash.style.opacity = '0'; }, 50);
            
            try {
                var d = 1.5 * 1000; var end = Date.now() + d;
                (function frame() {
                    confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#ec4899', '#818cf8'] });
                    confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#ec4899', '#818cf8'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } catch(e) {}

            showToast("🔥 പുതിയ റിസൾട്ട് പ്രസിദ്ധീകരിച്ചു! 🔥");
            currentViewIndex = 2; // Jump to Latest Results
            showCurrentView();
            resetRotation(); // Restart timer exactly from here
        }

        function startApp() {
            toggleFullScreen(); preventSleep();
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            unlockAudio(document.getElementById('sound-score'));
            unlockAudio(document.getElementById('sound-result'));
            appStarted = true; 
            renderAll();
            resetRotation();
        }

        var firebaseConfig = {
            apiKey: "AIzaSyCo3S007XNUl1bAfgAlMR1vJyDQBNFf6MI",
            authDomain: "kottam-eee89.firebaseapp.com",
            projectId: "kottam-eee89",
            storageBucket: "kottam-eee89.firebasestorage.app",
            messagingSenderId: "558082092753",
            appId: "1:558082092753:web:c0a69f647998061a3adff0"
        };
        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        var state = { teams: { teamA: { name: 'KHAIBAR WARRIORS' }, teamB: { name: 'KHANDAQ FIGHTERS' } }, programs: [], candidates: [], results: [] };
        var prevScoreA = -1; var prevScoreB = -1; var prevTotalRes = -1;

        function getProg(id) { for(var i=0; i<state.programs.length; i++) if(state.programs[i].id === id) return state.programs[i]; return null; }
        function getCand(id) { for(var i=0; i<state.candidates.length; i++) if(state.candidates[i].id === id) return state.candidates[i]; return null; }
        function getTeamName(tid) { 
            if(tid === 'KHAIBAR WARRIORS' || tid === 'teamA') return state.teams.teamA.name;
            if(tid === 'KHANDAQ FIGHTERS' || tid === 'teamB') return state.teams.teamB.name;
            return tid || '-'; 
        }

        auth.signInAnonymously().then(function() {
            db.collection('settings').doc('config').onSnapshot(function(snap) {
                if (snap.exists) { var d = snap.data(); if (d.programs) state.programs = d.programs; if(appStarted) renderAll(); }
            });
            db.collection('candidates').onSnapshot(function(snap) {
                var arr = []; snap.forEach(doc => { var d = doc.data(); d.id = doc.id; arr.push(d); }); state.candidates = arr; if(appStarted) renderAll();
            });
            db.collection('results').onSnapshot(function(snap) {
                var arr = []; snap.forEach(doc => { var d = doc.data(); d.id = doc.id; arr.push(d); }); state.results = arr; if(appStarted) renderAll();
            });
        });

        // Helper string generators
        function getCandNamesString(ids) {
            var arr = Array.isArray(ids) ? ids : (ids ? [ids] : []); if(arr.length === 0) return '-';
            return arr.map(id => { var c = getCand(id); return c ? c.name : '-'; }).join(', ');
        }
        function getTeamNamesString(ids) {
            var arr = Array.isArray(ids) ? ids : (ids ? [ids] : []); if(arr.length === 0) return '-';
            var teams = []; arr.forEach(id => { var c = getCand(id); if(c) { var t = getTeamName(c.team); if(teams.indexOf(t) === -1) teams.push(t); }});
            return teams.length > 0 ? teams.join(' & ') : '-';
        }
        function isGroupProgram(name, forceIsGroup) {
            if (forceIsGroup !== undefined) return forceIsGroup;
            if (!name) return false;
            const n = name.toLowerCase();
            return n.includes('group') || n.includes('burda') || n.includes('burdha') || n.includes('qawwali') || n.includes('mala') || n.includes('mash up') || n.includes('moulid') || n.includes('padappayatt') || n.includes('newspaper') || n.includes('collage');
        }

        function createTableView(viewId, title, progs, compactClass) {
            var taName = getTeamName('teamA'); var tbName = getTeamName('teamB');
            var headerImg = `<div class="header"><div class="flex items-center justify-center drop-shadow-lg mb-3" style="display:flex; justify-content:center; align-items:center;"><img src="https://i.ibb.co/98232f0908c9d480f91da32c8100c1d0.png" class="fest-logo-img" style="filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));"></div></div>`;
            
            var tbody = "";
            for (var p = 0; p < progs.length; p++) {
                var tProg = progs[p];
                var mlName = tProg.name.split('\n')[0];
                var isGrp = isGroupProgram(tProg.name, tProg.isGroup);
                
                var tTag = `<span class='s-tag' style='${tProg.type==="Non-Stage"?"background:#0f766e;":""}'>${tProg.type}</span>`;
                if(isGrp) tTag += "<span class='s-tag s-grp'>Group</span>";
                
                var tRes = state.results.find(r => r.progId === tProg.id);
                var a1="-", a2="-", a3="-", b1="-", b2="-", b3="-";

                if (tRes) {
                    var tF = tRes.pts1 || (isGrp ? 10 : 5); var tS = tRes.pts2 || (isGrp ? 5 : 3); var tT = tRes.pts3 || (isGrp ? 3 : 1);
                    var checkPts = function(ids, pts) {
                        var arr = Array.isArray(ids) ? ids : (ids ? [ids] : []);
                        for(var k=0; k<arr.length; k++) {
                            var cand = getCand(arr[k]);
                            if(cand) {
                                if(cand.team === 'KHAIBAR WARRIORS') { if(pts===tF) a1=tF; else if(pts===tS) a2=tS; else if(pts===tT) a3=tT; }
                                else if(cand.team === 'KHANDAQ FIGHTERS') { if(pts===tF) b1=tF; else if(pts===tS) b2=tS; else if(pts===tT) b3=tT; }
                            }
                        }
                    };
                    checkPts(tRes.first, tF); checkPts(tRes.second, tS); checkPts(tRes.third, tT);
                }

                var sA1 = a1 !== "-" ? "color:#fbbf24; font-size:120%;" : "color:#334155;";
                var sA2 = a2 !== "-" ? "color:#cbd5e1; font-size:110%;" : "color:#334155;";
                var sA3 = a3 !== "-" ? "color:#d97706; font-size:110%;" : "color:#334155;";
                var sB1 = b1 !== "-" ? "color:#fbbf24; font-size:120%;" : "color:#334155;";
                var sB2 = b2 !== "-" ? "color:#cbd5e1; font-size:110%;" : "color:#334155;";
                var sB3 = b3 !== "-" ? "color:#d97706; font-size:110%;" : "color:#334155;";

                tbody += `<tr>
                    <td class='t-left'><div class='prog-name-wrapper'><div class='p-name-txt'>${tProg.progNo?`#${tProg.progNo} ` : ''}${mlName}</div>${tTag}</div></td>
                    <td style='${sA1}'>${a1}</td><td style='${sA2}'>${a2}</td><td style='${sA3}'>${a3}</td>
                    <td class='br-left' style='${sB1}'>${b1}</td><td style='${sB2}'>${b2}</td><td style='${sB3}'>${b3}</td>
                </tr>`;
            }

            return `
            <div id="view-${viewId}" class="view-container">
                ${headerImg}
                <div class="page-title">പോയിന്റ് ടേബിൾ - ${title}</div>
                <div class="table-container">
                    <table class="pt-header-table"><colgroup><col style="width:28%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup>
                        <thead><tr><th rowspan="2" class="t-left">മത്സരം (Program)</th><th colspan="3" class="pt-team-a">${taName}</th><th colspan="3" class="pt-team-b br-left">${tbName}</th></tr>
                        <tr><th>🥇 1st</th><th>🥈 2nd</th><th>🥉 3rd</th><th class="br-left">🥇 1st</th><th>🥈 2nd</th><th>🥉 3rd</th></tr></thead>
                    </table>
                    <div class="no-scroll-wrapper"><table class="pt-table ${compactClass}"><colgroup><col style="width:28%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"></colgroup><tbody>${tbody}</tbody></table></div>
                </div>
            </div>`;
        }

        function renderAll() {
            if (!appStarted) return;
            
            var stats = { teamA: { total:0, boys:0, girls:0 }, teamB: { total:0, boys:0, girls:0 } };
            var candPoints = {}; 

            state.results.forEach(res => {
                var prog = getProg(res.progId);
                var isGrp = prog ? isGroupProgram(prog.name, prog.isGroup) : false;
                
                var fPts = res.pts1 || (isGrp ? 10 : 5); var sPts = res.pts2 || (isGrp ? 5 : 3); var tPts = res.pts3 || (isGrp ? 3 : 1);

                var addPts = function(ids, pts) {
                    var arr = Array.isArray(ids) ? ids : (ids ? [ids] : []);
                    arr.forEach(id => {
                        var c = getCand(id); 
                        if(c) { 
                            var tKey = c.team === 'KHAIBAR WARRIORS' ? 'teamA' : (c.team === 'KHANDAQ FIGHTERS' ? 'teamB' : null);
                            if(tKey) {
                                stats[tKey].total += pts; 
                                if(c.gender === 'BOYS') stats[tKey].boys += pts;
                                if(c.gender === 'GIRLS') stats[tKey].girls += pts;
                            }
                            if(!isGrp) candPoints[c.id] = (candPoints[c.id] || 0) + pts; // For Kalaprathiba
                        }
                    });
                };
                addPts(res.first, fPts); addPts(res.second, sPts); addPts(res.third, tPts);
            });
            
            var sortedRes = state.results.slice().sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            if (prevScoreA !== -1 && (prevScoreA !== stats.teamA.total || prevScoreB !== stats.teamB.total)) { playSound('score'); showToast("പോയിന്റ് നില അപ്ഡേറ്റ് ചെയ്തു!"); }
            if (prevTotalRes !== -1 && sortedRes.length > prevTotalRes) { triggerEpicReveal(); }
            prevScoreA = stats.teamA.total; prevScoreB = stats.teamB.total; prevTotalRes = sortedRes.length;

            var appContainer = document.getElementById('app');
            var dynamicHtml = '';
            var taName = getTeamName('teamA'); var tbName = getTeamName('teamB');
            var headerImg = `<div class="header"><div class="flex items-center justify-center drop-shadow-lg mb-3" style="display:flex; justify-content:center; align-items:center;"><img src="https://i.ibb.co/98232f0908c9d480f91da32c8100c1d0.png" class="fest-logo-img" style="filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));"></div></div>`;

            // VIEW 1: DASHBOARD
            dynamicHtml += `
            <div id="view-1" class="view-container">
                ${headerImg}
                <div class="page-title">ടീം പോയിന്റുകൾ (TOTAL SCORE)</div>
                <div class="dashboard-content">
                    <div class="team-block">
                        <div class="team-name team-a">${taName}</div>
                        <div class="huge-points num-font">${stats.teamA.total}</div>
                        <div class="gender-split">
                            <div class="g-stat"><span class="g-lbl">Boys</span><span class="g-pts num-font">${stats.teamA.boys}</span></div>
                            <div class="g-stat"><span class="g-lbl">Girls</span><span class="g-pts num-font">${stats.teamA.girls}</span></div>
                        </div>
                    </div>
                    <div class="vs-circle">VS</div>
                    <div class="team-block">
                        <div class="team-name team-b">${tbName}</div>
                        <div class="huge-points num-font">${stats.teamB.total}</div>
                        <div class="gender-split">
                            <div class="g-stat"><span class="g-lbl">Boys</span><span class="g-pts num-font">${stats.teamB.boys}</span></div>
                            <div class="g-stat"><span class="g-lbl">Girls</span><span class="g-pts num-font">${stats.teamB.girls}</span></div>
                        </div>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-box"><div class="stat-value num-font">${state.programs.length}</div><div class="stat-label">മത്സരങ്ങൾ</div></div>
                    <div class="stat-box"><div class="stat-value num-font">${state.candidates.length}</div><div class="stat-label">കുട്ടികൾ</div></div>
                    <div class="stat-box"><div class="stat-value num-font">${sortedRes.length}</div><div class="stat-label">ഫലങ്ങൾ</div></div>
                </div>
            </div>`;

            // VIEW 2: LATEST RESULTS
            var resCards = "";
            if (sortedRes.length === 0) resCards = "<h2 style='color:#64748b; grid-column:1 / -1; text-align:center;'>ഫലങ്ങൾ വന്നിട്ടില്ല...</h2>";
            for(var r=0; r<Math.min(sortedRes.length, 6); r++) {
                var lRes = sortedRes[r]; var lProg = getProg(lRes.progId);
                var pNames = lProg ? lProg.name.split('\n') : ['-']; 
                var isNew = (r === 0) ? " newest" : "";
                resCards += `<div class='res-card${isNew}'>${isNew?"<div class='corner-ribbon'></div>":""}<div class='rc-title'><div class='rc-title-text'><span>${lProg?.progNo?`#${lProg.progNo} `:''}${pNames[0]}</span></div><span class='rc-cat'>${lProg ? lProg.cat : ''}</span></div>`;
                if(getCandNamesString(lRes.first) !== '-') resCards += `<div class='rc-row first'><span class='rc-name'>🥇 ${getCandNamesString(lRes.first)}</span><span class='rc-team' style='color:#fbbf24'>${getTeamNamesString(lRes.first)}</span></div>`;
                if(getCandNamesString(lRes.second) !== '-') resCards += `<div class='rc-row second'><span class='rc-name'>🥈 ${getCandNamesString(lRes.second)}</span><span class='rc-team' style='color:#cbd5e1'>${getTeamNamesString(lRes.second)}</span></div>`;
                if(getCandNamesString(lRes.third) !== '-') resCards += `<div class='rc-row third'><span class='rc-name'>🥉 ${getCandNamesString(lRes.third)}</span><span class='rc-team' style='color:#b45309'>${getTeamNamesString(lRes.third)}</span></div>`;
                resCards += "</div>";
            }
            dynamicHtml += `<div id="view-2" class="view-container">${headerImg}<div class="page-title">ഏറ്റവും പുതിയ ഫലങ്ങൾ (LATEST RESULTS)</div><div class="results-grid">${resCards}</div></div>`;

            // VIEW 3: KALAPRATHIBA
            function getTopScorer(cat, gender) {
                let eligible = state.candidates.filter(c => c.cat === cat && c.gender === gender);
                let top = null; let max = 0;
                eligible.forEach(c => { if(candPoints[c.id] && candPoints[c.id] > max) { max = candPoints[c.id]; top = c; }});
                return top ? { ...top, pts: max } : null;
            }
            var tsCards = "";
            ['Kiddies', 'Sub Junior', 'Junior', 'Senior', 'Super Senior'].forEach(c => {
                var topB = getTopScorer(c, 'BOYS'); var topG = getTopScorer(c, 'GIRLS');
                var boyHtml = topB ? `<div class="ts-row"><div class="ts-icon">🤴</div><div class="ts-info"><span class="ts-award">Kalaprathiba</span><span class="ts-name">${topB.name}</span><span class="ts-team ${topB.team==='KHAIBAR WARRIORS'?'a':'b'}">${getTeamName(topB.team)}</span></div><div class="ts-pts num-font">${topB.pts}</div></div>` : `<div class="ts-row text-center text-slate-500 w-full p-4 italic">Boys TBA...</div>`;
                var girlHtml = topG ? `<div class="ts-row border-none"><div class="ts-icon">👸</div><div class="ts-info"><span class="ts-award">Kalathilakam</span><span class="ts-name">${topG.name}</span><span class="ts-team ${topG.team==='KHAIBAR WARRIORS'?'a':'b'}">${getTeamName(topG.team)}</span></div><div class="ts-pts num-font" style="color:#f472b6;">${topG.pts}</div></div>` : `<div class="ts-row border-none text-center text-slate-500 w-full p-4 italic">Girls TBA...</div>`;
                tsCards += `<div class="ts-card"><div class="ts-header">${c}</div>${boyHtml}${girlHtml}</div>`;
            });
            dynamicHtml += `<div id="view-3" class="view-container">${headerImg}<div class="page-title">Top Scorers (കലാപ്രതിഭ & കലാതിലകം)</div><div class="ts-grid">${tsCards}</div></div>`;

            // VIEWS 4+: DYNAMIC PAGINATED TABLES
            let viewCounter = 4;
            let cats = ['Kiddies', 'Sub Junior', 'Junior', 'Senior', 'Super Senior', 'General'];
            let genders = ['BOYS', 'GIRLS'];

            cats.forEach(c => {
                genders.forEach(g => {
                    let progs = state.programs.filter(p => {
                        let pGender = p.gender || 'ALL';
                        if(pGender === 'ALL') {
                            if(p.name.toLowerCase().includes('boys')) pGender = 'BOYS';
                            else if(p.name.toLowerCase().includes('girls')) pGender = 'GIRLS';
                        }
                        return p.cat === c && (pGender === g || pGender === 'ALL');
                    });
                    
                    if(progs.length > 0) {
                        progs.sort((a,b)=> Number(a.progNo || 0) - Number(b.progNo || 0));
                        for(let i=0; i<progs.length; i+=13) {
                            let chunk = progs.slice(i, i+13);
                            let title = `${c.toUpperCase()} (${g})`;
                            let compactClass = chunk.length > 9 ? "compact-table" : (chunk.length > 6 ? "semi-compact-table" : "");
                            dynamicHtml += createTableView(viewCounter, title, chunk, compactClass);
                            viewCounter++;
                        }
                    }
                });
            });

            appContainer.innerHTML = dynamicHtml;
            showCurrentView(); 
        }
    </script>
</body>
</html>
